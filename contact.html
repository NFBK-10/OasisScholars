<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <title>OASISSCHOLARS | Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img class="brand-logo" src="Logo for design.png" alt="OASISSCHOLARS logo" /><span>OASISSCHOLARS</span></a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="opportunities.html">Opportunities</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button class="menu-toggle" aria-label="Open navigation">☰</button>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-header">
      <h1>Contact</h1>
      <p>Have questions or want help finding the right scholarship? Reach out and we’ll help you take the next step.</p>
    </section>

    <section class="contact-section">
      <div class="contact-grid">
        <div class="contact-card">
          <h2>Email</h2>
          <p>hello@oasisscholars.org</p>
        </div>
        <div class="contact-card">
          <h2>Phone</h2>
          <p><a href="tel:+250791513977">+250 791 513 977</a></p>
        </div>
        <div class="contact-card">
          <h2>WhatsApp</h2>
          <p><a href="https://wa.me/250791513977" target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a></p>
        </div>
      </div>

      <form class="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" maxlength="80" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Your email" maxlength="254" autocomplete="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" maxlength="1000" placeholder="Tell us how we can help" required></textarea>

        <button type="submit" class="button button-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 OASISSCHOLARS</p>
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
