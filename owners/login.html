<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://esm.sh https://*.supabase.co https://*.supabase.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <title>Owners Login | OASISSCHOLARS</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../Logo for design.png" alt="OASISSCHOLARS logo" /><span>OASISSCHOLARS</span></a>
      <nav class="site-nav">
        <a href="../index.html">Home</a>
        <a href="../opportunities.html">Opportunities</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-header">
      <h1>Owners Portal</h1>
      <p>Owners can register, log in, and prepare scholarship opportunities with images, full details, and documents.</p>
    </section>

    <section class="about-section">
      <div style="max-width:520px; margin:0 auto;">
        <form id="owner-form" class="contact-form">
          <label for="owner-name">Name</label>
          <input id="owner-name" name="name" type="text" placeholder="Your name" maxlength="80" autocomplete="name" required />

          <label for="owner-email">Email</label>
          <input id="owner-email" name="email" type="email" placeholder="you@org.org" maxlength="254" autocomplete="email" required />

          <label for="owner-password">Password</label>
          <input id="owner-password" name="password" type="password" placeholder="Choose a password" minlength="8" autocomplete="current-password" required />

          <div style="display:flex; gap:0.75rem;">
            <button id="register-btn" type="button" class="button button-primary">Register</button>
            <button id="login-btn" type="button" class="button button-secondary">Login</button>
          </div>
        </form>
        <p id="owner-message" style="color:var(--deep-forest); font-weight:600; margin-top:1rem"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 OASISSCHOLARS</p>
      <nav class="footer-nav">
        <a href="../terms.html">Terms</a>
        <a href="../privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="owners.js"></script>
</body>
</html>
