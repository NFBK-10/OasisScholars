<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owners Dashboard | OASISSCHOLARS</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../logo for design.png" alt="logo" /><span>OASISSCHOLARS</span></a>
      <nav class="site-nav">
        <a href="../index.html">Home</a>
        <a href="../opportunities.html">Opportunities</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="login.html" id="logout-link" style="display:none;">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-header">
      <h1>Owner Dashboard</h1>
      <p>Post new scholarship opportunities and manage existing ones.</p>
    </section>

    <section class="about-section">
      <div class="team-grid">
        <div style="flex:1; min-width:320px;">
          <h3>Create Opportunity</h3>
          <form id="post-form" class="contact-form">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>

            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date" required />

            <button id="post-btn" class="button button-primary" type="button">Post Opportunity</button>
          </form>
          <p id="post-message" style="margin-top:1rem; color:var(--deep-forest)"></p>
        </div>

        <div style="flex:1; min-width:320px;">
          <h3>Your Posts</h3>
          <div id="owner-posts"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 OASISSCHOLARS</p>
    </div>
  </footer>

  <script src="owners.js"></script>
</body>
</html>
